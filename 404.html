<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found - ORVIYNT Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101010;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
        }

        h1 {
            font-size: 100px;
            color: #d5a85c;
        }

        h2 {
            margin-bottom: 15px;
        }

        p {
            color: #b5b5b5;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 13px 25px;
            background: #d5a85c;
            color: #101010;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>
            Sorry, the page you are looking for doesn't exist
            or may have been moved.
        </p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
